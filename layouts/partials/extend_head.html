{{/* Extended head for custom theme enhancements */}}

{{/* Theme color for browser chrome */}}
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1D1B" media="(prefers-color-scheme: dark)">

{{/* Additional meta for enhanced appearance */}}
<meta name="color-scheme" content="light dark">

{{/* MathJax for LaTeX math rendering */}}
<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        startup: {
            // Typesetting math changes the height of everything above the
            // target, so a page opened directly at "#some-heading" has already
            // jumped to the wrong place by the time the math renders. Re-jump
            // once typesetting is done.
            pageReady: function () {
                return MathJax.startup.defaultPageReady().then(function () {
                    if (!location.hash) return;
                    var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
                    if (el) el.scrollIntoView();
                });
            }
        }
    };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
