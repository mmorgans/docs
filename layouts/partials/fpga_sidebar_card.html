{{- $variant := .variant | default "sidebar" -}}

{{- if eq $variant "inline" -}}
<details class="fpga-card-shell fpga-card-shell--inline" open>
  <summary class="fpga-card-shell-summary">
    <span class="fpga-card-shell-summary-title">Live FPGA guide</span>
    <span class="fpga-card-shell-summary-note">Updates as you scroll</span>
  </summary>
  <div class="fpga-card-shell-body">
    {{- partial "fpga_sidebar_card_inner.html" . -}}
  </div>
</details>
{{- else -}}
<aside class="fpga-card-shell fpga-card-shell--sidebar" aria-label="Field Portable Gas Analyzer guide">
  {{- partial "fpga_sidebar_card_inner.html" . -}}
</aside>
{{- end -}}
